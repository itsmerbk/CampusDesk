name: CampusDesk CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - run: mkdir -p out && javac -cp "lib/*" -d out src/com/campusdesk/*.java
      - run: java -ea --enable-native-access=ALL-UNNAMED -cp "out:lib/*" com.campusdesk.CampusDeskTest
